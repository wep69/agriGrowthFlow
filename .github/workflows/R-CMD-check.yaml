name: R-CMD-check
on: [push, pull_request]
jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}
    name: ${{ matrix.config.os }} (${{ matrix.config.r }})
    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: windows-latest, r: 'release', args: 'c("--no-manual", "--as-cran", "--no-build-vignettes")'}
          - {os: macos-latest,   r: 'release', args: 'c("--no-manual", "--as-cran", "--no-build-vignettes")'}
          - {os: ubuntu-latest,   r: 'devel',   args: 'c("--no-manual", "--as-cran", "--no-build-vignettes")'}
          - {os: ubuntu-latest,   r: 'release', args: 'c("--no-manual", "--as-cran")'}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          use-public-rspm: true
      - uses: r-lib/actions/setup-pandoc@v2
      - name: Install pak
        run: install.packages("pak", repos = "https://r-lib.github.io/p/pak/dev/")
        shell: Rscript {0}
      - name: Install dependencies with pak
        run: |
          options(repos = c(stan = "https://mc-stan.org/r-packages/", getOption("repos")))
          pak::local_install_dev_deps(upgrade = FALSE, ask = FALSE, dependencies = c("Depends", "Imports", "LinkingTo"))
          pak::pak(c("knitr","rmarkdown","testthat","roxygen2","devtools","ggplot2","rlang","minpack.lm","nlme","mgcv","scam","refund","fdapace","brms","posterior","loo"), ask = FALSE)
          try(pak::pak("stan-dev/cmdstanr", ask = FALSE), silent = TRUE)
          pak::pak("any::rcmdcheck", ask = FALSE)
        shell: Rscript {0}
      - uses: r-lib/actions/check-r-package@v2
        with:
          args: ${{ matrix.config.args }}
          upload-snapshots: true
