name: pkgdown
on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pkgdown:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-pandoc@v2
      - name: Install pak
        run: install.packages("pak", repos = "https://r-lib.github.io/p/pak/dev/")
        shell: Rscript {0}
      - name: Install dependencies
        run: |
          options(repos = c(stan = "https://mc-stan.org/r-packages/", getOption("repos")))
          pak::local_install_dev_deps(upgrade = FALSE, ask = FALSE, dependencies = c("Depends", "Imports", "LinkingTo"))
          pak::pak(c("knitr","rmarkdown","testthat","ggplot2","rlang","minpack.lm","nlme","mgcv","scam","refund","fdapace","pkgdown","any::rcmdcheck"), ask = FALSE)
          try(pak::pak("stan-dev/cmdstanr", ask = FALSE), silent = TRUE)
        shell: Rscript {0}
      - name: Build site
        run: pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)
        shell: Rscript {0}
      - name: Deploy to GitHub pages
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          clean: false
          branch: gh-pages
          folder: docs
